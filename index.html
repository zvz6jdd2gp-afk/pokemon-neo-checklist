<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>Pokémon Neo — Checklist japonaise</title>
<style>
:root{
  --bg:#f2f3f7;--panel:#fff;--text:#17181a;--muted:#70747c;
  --line:#e1e3e8;--accent:#e94b63;--dark:#15171b;--ok:#238b5b;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:30px;
}
.app-header{
  background:linear-gradient(145deg,#12151a,#252a32);
  color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;
  position:sticky;top:0;z-index:30;box-shadow:0 4px 18px #0003;
}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:10px;letter-spacing:1.4px;color:#aeb4bd;font-weight:800;margin-bottom:3px}
h1{font-size:25px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.6px}
h1 span{color:#ff687e}
.app-header p{margin:6px 0 0;color:#bfc4cc;font-size:12px}
.progress-pill{
  min-width:48px;height:38px;padding:0 11px;border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  background:#ffffff16;border:1px solid #ffffff22;font-weight:800;font-size:13px
}
.controls{
  background:#fff;padding:12px 14px 14px;position:sticky;top:95px;z-index:25;
  border-bottom:1px solid var(--line);box-shadow:0 2px 10px #00000008;
}
.search-wrap{display:flex;align-items:center;background:#f0f1f4;border-radius:13px;padding:0 11px;margin-bottom:12px}
.search-wrap span{font-size:25px;color:#777;line-height:1}
#search{width:100%;border:0;background:transparent;padding:12px 8px;font-size:15px;outline:none}
.select-label{font-size:9px;letter-spacing:1px;font-weight:800;color:#858991;margin:0 0 5px 2px}
select{
  width:100%;padding:11px 34px 11px 12px;border:1px solid #dfe1e6;border-radius:11px;
  background:#fff;color:#1b1d20;font-size:14px;font-weight:650;appearance:auto
}
.big-select{margin-bottom:10px}
.series-buttons{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px
}
.series-btn{
  border:1px solid #e1e3e8;background:#f7f8fa;border-radius:12px;
  min-height:53px;padding:7px 8px;display:flex;align-items:center;
  gap:8px;text-align:left;color:#222
}
.series-btn.active{
  background:#17191d;color:#fff;border-color:#17191d;
  box-shadow:0 3px 9px #0002
}
.series-btn:last-child{grid-column:1/-1}
.series-icon{
  width:30px;height:30px;flex:0 0 30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:#e9ebef;font-size:12px;font-weight:900
}
.series-btn.active .series-icon{background:#e94b63;color:#fff}
.series-btn b{display:block;font-size:11px;line-height:1.15}
.series-btn small{display:block;font-size:9px;color:#858991;margin-top:2px}
.series-btn.active small{color:#bfc4cc}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.summary-card{
  display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding:11px 12px;
  background:#f6f7f9;border-radius:12px
}
.summary-card>div{display:flex;flex-direction:column;min-width:0}
.summary-card>div+div{text-align:right}
.summary-card strong{font-size:16px}
.summary-card span{font-size:10px;color:var(--muted);margin-top:2px}
.summary{font-size:11px;color:#777;margin:7px 2px 0;display:none}
.layout-control{
  background:#fff;margin-top:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:326px;z-index:24
}
.layout-control .select-label{margin:0}
.columns{display:flex;background:#eef0f3;padding:3px;border-radius:10px;gap:2px}
.columns button{
  border:0;background:transparent;border-radius:8px;min-width:38px;height:31px;
  font-size:13px;font-weight:800;color:#6d7179
}
.columns button.active{background:#fff;color:#17181a;box-shadow:0 1px 4px #0002}
main{padding:12px 10px;max-width:1100px;margin:auto}
.set{margin:0 0 22px}
.set h2{
  font-size:17px;margin:5px 3px 9px;display:flex;align-items:center;gap:7px
}
.set h2:before{content:"";width:4px;height:18px;border-radius:4px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
body.cols-3 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
body.cols-4 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:var(--panel);border-radius:10px;padding:6px;box-shadow:0 1px 5px #00000012;
  min-width:0;overflow:hidden
}
.card img{
  width:100%;aspect-ratio:.72;object-fit:cover;border-radius:7px;background:#e7e8eb;display:block
}
.card-title{font-size:11px;font-weight:750;margin:5px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-number{font-size:10px;color:#8a8e96;margin:2px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:3px;margin-top:5px}
.owned{display:flex;align-items:center;gap:3px;font-size:9px;white-space:nowrap}
.owned input{width:17px;height:17px;margin:0;accent-color:var(--ok)}
.price{width:58px;padding:5px 4px;border:1px solid #d7d9de;border-radius:7px;text-align:right;font-size:10px}
.hidden{display:none!important}
.empty{padding:25px;text-align:center;color:#6b7280}
@media(min-width:700px){
  .controls,.layout-control{position:static;max-width:1100px;margin:auto}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  body.cols-3 .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  body.cols-4 .grid{grid-template-columns:repeat(8,minmax(0,1fr))}
}
</style>
</head>
<body>
<header class="app-header">
<div class="header-top">
<div>
<div class="eyebrow">COLLECTION JAPONAISE</div>
<h1>🃏 Pokémon <span>Neo</span></h1>
</div>
<div class="progress-pill" id="progressPill">0%</div>
</div>
<p>Ta checklist personnelle — 331 cartes</p>
</header>

<div class="controls">
<div class="search-wrap">
<span>⌕</span>
<input id="search" type="search" placeholder="Rechercher une carte ou un numéro…">
</div>

<div class="select-label">CHOISIR UNE SÉRIE</div>
<div class="series-buttons">
<button type="button" class="series-btn active" data-series="all">
  <span class="series-icon">★</span><span><b>Toutes</b><small>331 cartes</small></span>
</button>
<button type="button" class="series-btn" data-series="neo1">
  <span class="series-icon">1</span><span><b>Neo Genesis</b><small>102 cartes</small></span>
</button>
<button type="button" class="series-btn" data-series="neo2">
  <span class="series-icon">2</span><span><b>Neo Discovery</b><small>59 cartes</small></span>
</button>
<button type="button" class="series-btn" data-series="neo3">
  <span class="series-icon">3</span><span><b>Neo Revelation</b><small>57 cartes</small></span>
</button>
<button type="button" class="series-btn" data-series="neo4">
  <span class="series-icon">4</span><span><b>Neo Destiny</b><small>113 cartes</small></span>
</button>
</div>

<div class="control-grid">
<div>
<div class="select-label">AFFICHER</div>
<select id="filter">
<option value="all">Toutes les cartes</option>
<option value="missing">À trouver</option>
<option value="owned">Possédées</option>
</select>
</div>
<div>
<div class="select-label">TRIER PAR</div>
<select id="sort">
<option value="number">Numéro</option>
<option value="price">Prix</option>
</select>
</div>
</div>

<div class="summary-card">
<div>
<strong id="ownedCount">0 / 331</strong>
<span>cartes possédées</span>
</div>
<div>
<strong id="totalSpent">0,00 €</strong>
<span>dépensés</span>
</div>
</div>
<div class="summary" id="summary">Chargement…</div>
</div>

<div class="layout-control">
<div class="select-label">CARTES PAR LIGNE</div>
<div class="columns" role="group" aria-label="Nombre de cartes par ligne">
<button type="button" data-cols="2" class="active">2</button>
<button type="button" data-cols="3">3</button>
<button type="button" data-cols="4">4</button>
</div>
</div>

<main id="app"></main>

<script>
(function(){
"use strict";

const sets = [
  {name:"Neo Genesis", code:"neo1", count:102, nums:[...Array(96)].map((_,i)=>i+1).concat([106,107,108,109,110,111])},
  {name:"Neo Discovery", code:"neo2", count:59, nums:[...Array(56)].map((_,i)=>i+1).concat([67,68])},
  {name:"Neo Revelation", code:"neo3", count:57, nums:[...Array(57)].map((_,i)=>i+1)},
  {name:"Neo Destiny", code:"neo4", count:113, nums:[...Array(113)].map((_,i)=>i+1)}
];

const KEY="pokemon-neo-checklist-v2";
let state={};

try{ state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){state={};}

const app=document.getElementById("app");

function key(code,num){return code+"-"+num;}
function imageUrl(code,num){
  return "https://aplnyshrkrgbselitojs.supabase.co/storage/v1/object/public/card-images/"+(
    code==="neo1"?"neo-genesis":
    code==="neo2"?"neo-discovery":
    code==="neo3"?"neo-revelation":"neo-destiny"
  )+"/"+code+"-"+String(num).padStart(3,"0")+".jpg";
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
function render(){
  app.innerHTML="";
  sets.forEach(set=>{
    const section=document.createElement("section");
    section.className="set";
    section.dataset.set=set.code;
    const h=document.createElement("h2");
    h.textContent=set.name+" ("+set.count+" cartes)";
    section.appendChild(h);
    const grid=document.createElement("div");
    grid.className="grid";

    set.nums.forEach(num=>{
      const k=key(set.code,num);
      const data=state[k]||{};
      const card=document.createElement("article");
      card.className="card";
      card.dataset.key=k;
      card.dataset.number=String(num);
      card.dataset.owned=data.owned?"1":"0";
      card.dataset.price=data.price||"";

      const img=document.createElement("img");
      img.loading="lazy";
      img.alt=set.name+" "+num;
      img.src=imageUrl(set.code,num);
      img.onerror=function(){
        this.style.objectFit="contain";
        this.src="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420"><rect width="100%" height="100%" fill="#e5e7eb"/><text x="50%" y="48%" text-anchor="middle" font-size="24" fill="#6b7280">Image</text><text x="50%" y="55%" text-anchor="middle" font-size="18" fill="#6b7280">indisponible</text></svg>'
        );
      };
      card.appendChild(img);

      const title=document.createElement("div");
      title.className="card-title";
      title.textContent=set.name;
      card.appendChild(title);

      const number=document.createElement("div");
      number.className="card-number";
      number.textContent="#"+String(num).padStart(3,"0");
      card.appendChild(number);

      const bottom=document.createElement("div");
      bottom.className="card-bottom";

      const label=document.createElement("label");
      label.className="owned";
      const check=document.createElement("input");
      check.type="checkbox";
      check.checked=!!data.owned;
      check.addEventListener("change",function(){
        state[k]=state[k]||{};
        state[k].owned=this.checked;
        card.dataset.owned=this.checked?"1":"0";
        save(); update();
      });
      label.appendChild(check);
      label.appendChild(document.createTextNode("Achetée"));

      const price=document.createElement("input");
      price.className="price";
      price.type="number";
      price.min="0";
      price.step="0.01";
      price.inputMode="decimal";
      price.placeholder="€";
      price.value=data.price||"";
      price.addEventListener("input",function(){
        state[k]=state[k]||{};
        state[k].price=this.value;
        card.dataset.price=this.value;
        save(); update();
      });

      bottom.appendChild(label);
      bottom.appendChild(price);
      card.appendChild(bottom);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    app.appendChild(section);
  });
  update();
}

function update(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const series=window.selectedSeries || "all";
  const filter=document.getElementById("filter").value;
  const sort=document.getElementById("sort").value;
  let total=0, owned=0, visible=0;

  document.querySelectorAll(".card").forEach(card=>{
    const k=card.dataset.key;
    const data=state[k]||{};
    const matchText=(card.dataset.number+" "+card.querySelector(".card-title").textContent).toLowerCase().includes(q);
    const matchSeries=series==="all" || card.dataset.key.startsWith(series+"-");
    const matchFilter=filter==="all" || (filter==="owned" ? !!data.owned : !data.owned);
    const show=matchText && matchSeries && matchFilter;
    card.classList.toggle("hidden",!show);
    if(show) visible++;
    if(data.owned) owned++;
    const p=parseFloat(data.price);
    if(!isNaN(p)) total+=p;
  });

  const seriesNames={all:"Toutes les séries",neo1:"Neo Genesis",neo2:"Neo Discovery",neo3:"Neo Revelation",neo4:"Neo Destiny"};
  const seriesName = series==="all" ? "" : " • "+seriesNames[series];
  document.getElementById("ownedCount").textContent=owned+" / 331";
  document.getElementById("totalSpent").textContent=total.toFixed(2).replace(".",",")+" €";
  document.getElementById("summary").textContent=
    visible+" cartes affichées"+seriesName;
  document.getElementById("progressPill").textContent=Math.round(owned/331*100)+"%";

  document.querySelectorAll(".grid").forEach(grid=>{
    const cards=[...grid.children];
    cards.sort((a,b)=>{
      if(sort==="price"){
        return (parseFloat((state[a.dataset.key]||{}).price)||0)-
               (parseFloat((state[b.dataset.key]||{}).price)||0);
      }
      return parseInt(a.dataset.number)-parseInt(b.dataset.number);
    });
    cards.forEach(c=>grid.appendChild(c));
  });
}

document.getElementById("search").addEventListener("input",update);
document.getElementById("filter").addEventListener("change",update);

document.querySelectorAll(".series-btn").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".series-btn").forEach(function(b){b.classList.remove("active");});
    this.classList.add("active");
    window.selectedSeries=this.dataset.series;
    try{localStorage.setItem("pokemon-neo-series",window.selectedSeries);}catch(e){}
    update();
  });
});
document.getElementById("sort").addEventListener("change",update);

document.querySelectorAll(".columns button").forEach(function(btn){
  btn.addEventListener("click",function(){
    const n=this.dataset.cols;
    document.body.classList.remove("cols-2","cols-3","cols-4");
    document.body.classList.add("cols-"+n);
    document.querySelectorAll(".columns button").forEach(function(b){b.classList.remove("active");});
    this.classList.add("active");
    try{localStorage.setItem("pokemon-neo-columns",n);}catch(e){}
  });
});
window.selectedSeries="all";
try{
  const savedSeries=localStorage.getItem("pokemon-neo-series");
  if(["all","neo1","neo2","neo3","neo4"].includes(savedSeries)){
    window.selectedSeries=savedSeries;
    document.querySelectorAll(".series-btn").forEach(function(b){
      b.classList.toggle("active",b.dataset.series===savedSeries);
    });
  }
}catch(e){}

try{
  const savedCols=localStorage.getItem("pokemon-neo-columns");
  if(["2","3","4"].includes(savedCols)){
    document.body.classList.add("cols-"+savedCols);
    document.querySelectorAll(".columns button").forEach(function(b){
      b.classList.toggle("active",b.dataset.cols===savedCols);
    });
  }else{document.body.classList.add("cols-2");}
}catch(e){document.body.classList.add("cols-2");}

render();
})();
</script>
</body>
</html>
